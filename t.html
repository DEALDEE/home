  <iframe id="myFrame" src=""></iframe>

<script>
  (function() {
    // 1. อ่าน Path และ Query String ทั้งหมดจาก URL
    let fullPath = window.location.pathname.substring(1) + window.location.search;

    if (fullPath.startsWith("/")) {
      fullPath = fullPath.substring(1);
    }

    // ตัดพวก facebook tracking ทิ้ง (ถ้ามี &)
    let ampersandIndex = fullPath.indexOf("&");
    if (ampersandIndex !== -1) {
      fullPath = fullPath.substring(0, ampersandIndex);
    }

    // 2. ส่งค่าไปที่ Google Apps Script
    let cacheBust = new Date().getTime();
    let link3 = "https://script.google.com/macros/s/AKfycbzBpW00CY0Y3X9ZkwtFXGi_Nyv5aOes1KmQkToF-GmPmAwAUb9PYpgnDlMl9h8nbZde/exec?seree=" + encodeURIComponent(fullPath) + "&cb=" + cacheBust;

    let iframe = document.querySelector("#myFrame");
    let loadingDiv = document.querySelector("#loading");

    iframe.onload = function() {
      loadingDiv.style.display = "none";
      iframe.style.display = "block";
    };

    iframe.setAttribute("src", link3);
  })();
</script>

</body>
