  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; 
      font-family: sans-serif;
    }

    #myFrame {
      position: fixed; 
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      z-index: 1000;
    }
</style>

<style>
  .loadewarapoper {
    font-family: sans-serif;
    box-sizing: border-box; /* สำคัญเพื่อไม่ให้ padding ดันขนาดเกิน 100vw */
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 80vh;
    background-color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 15px;
    gap: 20px;
  }

  .tranasfeontainer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px; 
    width: 100%;
    max-width: 450px; /* จำกัดความกว้างไม่ให้ยืดกว้างเกินไปบนจอใหญ่ */
    box-sizing: border-box;
  }

  .nasweasode {
    border: 2px solid #333;
    padding: 8px 6px;
    border-radius: 8px;
    background: #f9f9f9;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1; 
    min-width: 0; /* บังคับให้ flex item ยอมหดตัวและไม่ดันล้น */
    box-sizing: border-box;
  }

  .nasweasode span {
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .imageafsedery {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
    justify-content: center;
    width: 100%;
    min-width: 0;
  }

  .imageafsedery img {
    width: 100%; 
    height: 80px;
    object-fit: cover;
    border-radius: 4px;
  }

  .datasewrene {
    flex-shrink: 0; 
    width: 40px; /* ลดความกว้างเส้นเชื่อมลงให้อยู่ในสัดส่วนที่พอดี */
    height: 4px;
    background: #ddd;
    position: relative;
    overflow: hidden; 
    border-radius: 2px;
  }

  .loadixdswreext {
    color: #666;
    font-size: 13px;
    text-align: center;
    padding: 0 10px;
  }

  .dataswrdweac {
    position: absolute;
    top: 0;
    left: -30%;
    width: 30%;
    height: 100%;
    background: linear-gradient(90deg, transparent, #004aad, #ffffff);
    border-radius: 2px;
    animation: transfer 1.2s infinite linear;
  }

  @keyframes transfer {
    0% {
      left: -30%;
    }
    100% {
      left: 100%;
    }
  }
</style>

<body>

<div class="loadewarapoper" id="loading">
  <div class="tranasfeontainer">
    <div class="nasweasode">
      <span>ดีลดีคาร์</span>
      <div class="imageafsedery">
        <img src="https://lh3.googleusercontent.com/d/1LnEq91qsDH2KxQ6BbwQd14OhlWVxPmjh">
      </div>
    </div>

    <div class="datasewrene">
      <div class="dataswrdweac"></div>
    </div>

    <div class="nasweasode">
      <span>ดีลดีคาร์</span>
      <div class="imageafsedery" id="serverGallery"></div>
    </div>
  </div>

  <div class="loadixdswreext"><span class="mdi mdi-loading mdi-spin"></span> กำลังถ่ายโอนข้อมูลไปยังปลายทาง...</div>
</div>

  <iframe id="myFrame" src=""></iframe>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
      // 1. ดึง URL จาก meta tag og:image
      const ogImageMeta = document.querySelector('meta[property="og:image"]');
      
      if (ogImageMeta) {
        // ใช้ .trim() เพื่อตัดช่องว่างหน้า URL ออก
        const imageUrl = ogImageMeta.getAttribute("content").trim();
        const gallery = document.getElementById("serverGallery");

        // ตัวอย่าง: หากต้องการแสดงภาพเดียวกันหลายภาพ (เช่น 3 ภาพ)
        const totalImages = 1; 

        for (let i = 0; i < totalImages; i++) {
          const img = document.createElement("img");
          img.src = imageUrl;
          img.alt = `Server Image ${i + 1}`;
          
          // ใส่ภาพลงไปในส่วนของ SERVER
          gallery.appendChild(img);
        }
      }
    });
  </script>
  
<script>
  (function() {
    let fullPath = window.location.pathname + window.location.search;
    
    // ตัดเครื่องหมาย / ตัวแรกสุดออก (ถ้ามี)
    if (fullPath.startsWith("/")) {
      fullPath = fullPath.substring(1);
    }
    
    // ถ้าเจอเครื่องหมาย & ให้ตัดข้อความตั้งแต่ & ตัวแรกออกไปเลย เพื่อตัดพวก fbclid ทิ้ง
    let ampersandIndex = fullPath.indexOf("&");
    if (ampersandIndex !== -1) {
      fullPath = fullPath.substring(0, ampersandIndex);
    }
    
    let combinedId = fullPath;
    let cacheBust = new Date().getTime();
    
    let link3 = "https://script.google.com/macros/s/AKfycbzBpW00CY0Y3X9ZkwtFXGi_Nyv5aOes1KmQkToF-GmPmAwAUb9PYpgnDlMl9h8nbZde/exec?seree=" + encodeURIComponent(combinedId) + "&cb=" + cacheBust;

    let iframe = document.querySelector("#myFrame");
    let loadingDiv = document.querySelector("#loading");

    iframe.onload = function() {
      loadingDiv.style.display = "none";
      iframe.style.display = "block";
    };

    let link = window.location.href;
    if (!link.includes("dealdee.github.io/index.html")) {
      iframe.setAttribute("src", link3);
    }
  })();
</script>

</body>
</html>
